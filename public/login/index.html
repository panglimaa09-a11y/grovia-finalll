<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GROVIA Login</title><style>body{margin:0;min-height:100vh;background:#070a0f;color:#edf3f8;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center}.card{width:min(430px,calc(100% - 32px));background:#0c1118;border:1px solid #202a35;border-radius:20px;padding:28px;box-sizing:border-box}.muted{color:#7d8997;font-size:12px}.field{margin:14px 0}.field label{display:block;font-size:11px;color:#8d99a6;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #202a35;border-radius:10px;background:#0b1218;color:#fff}.btn{width:100%;padding:11px;border-radius:10px;border:1px solid #2a3540;background:#101720;color:#edf3f8;cursor:pointer;margin-top:8px}.primary{background:linear-gradient(135deg,#caff66,#6debb4);color:#071008;border:0;font-weight:800}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{min-height:18px;margin-top:12px;color:#ff9a9e;font-size:11px}.sep{display:flex;align-items:center;gap:8px;color:#56616c;font-size:10px;margin:18px 0}.sep:before,.sep:after{content:"";height:1px;background:#202a35;flex:1}</style></head><body><main class="card"><h1>GROVIA</h1><div class="muted">Production Login</div><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Login</button></form><div class="sep">USER SOCIAL LOGIN</div><div class="row"><button class="btn" type="button" onclick="oauth('google')">Google</button><button class="btn" type="button" onclick="oauth('facebook')">Facebook</button></div><div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;async function init(){const j=await fetch('/api/public-config').then(r=>r.json());if(!j.ok||!j.data.supabaseUrl||!j.data.supabaseAnonKey)throw Error('Konfigurasi autentikasi belum tersedia.');sb=supabase.createClient(j.data.supabaseUrl,j.data.supabaseAnonKey)}function msg(x){document.getElementById('msg').textContent=x}async function oauth(provider){try{if(!sb)await init();const{error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+'/user/'}});if(error)throw error}catch(e){msg(e.message||'Login sosial gagal')}}async function routeAfterLogin(session){const r=await fetch('/api/auth/admin-check',{headers:{Authorization:'Bearer '+session.access_token}});const j=await r.json();if(j.ok&&j.data?.isAdmin){location.href='/admin/';return}location.href='/user/'}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();msg('');try{if(!sb)await init();const{data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;if(!data.session)throw Error('Session tidak dibuat');await routeAfterLogin(data.session)}catch(e){msg(e.message||'Login gagal')}};init().catch(e=>msg(e.message));</script></body></html>
