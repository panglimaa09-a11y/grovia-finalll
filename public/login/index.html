<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GROVIA Authentication</title><style>:root{--bg:#070a0f;--p:#0c1118;--l:#202a35;--t:#edf3f8;--m:#7d8997;--g:#bdf85e;--g2:#6fe8b2;--r:#ff9a9e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#111a22 0,#070a0f 45%);color:var(--t);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(470px,100%);background:rgba(12,17,24,.96);border:1px solid var(--l);border-radius:22px;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.35)}h1{margin:0 0 6px;font-size:30px;letter-spacing:.06em}.sub{color:var(--m);font-size:12px;margin-bottom:24px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#0a1016;border:1px solid var(--l);border-radius:12px;padding:4px;margin-bottom:20px}.tabs button{border:0;background:transparent;color:var(--m);padding:10px;border-radius:9px;cursor:pointer;font-weight:700}.tabs button.active{background:#151e27;color:#fff}.field{margin:12px 0}.field label{display:block;font-size:11px;color:#8d99a6;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;background:#0b1218;color:#fff;outline:none}.field input:focus{border-color:#4d667d}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;padding:12px;border-radius:10px;border:1px solid #2a3540;background:#101720;color:#edf3f8;cursor:pointer;font-weight:700}.primary{border:0;background:linear-gradient(135deg,var(--g),var(--g2));color:#071008}.link{margin-top:12px;text-align:center}.link button{border:0;background:none;color:#9ac8ff;cursor:pointer;font-size:11px}.sep{display:flex;align-items:center;gap:8px;color:#56616c;font-size:10px;margin:18px 0}.sep:before,.sep:after{content:"";height:1px;background:var(--l);flex:1}.msg{min-height:18px;margin-top:12px;color:var(--r);font-size:11px;line-height:1.5;white-space:pre-wrap}.success{color:var(--g2)}.hide{display:none!important}.note{font-size:10px;color:#66727f;text-align:center;margin-top:18px}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>GROVIA</h1><div class="sub">Social Growth OS · Secure Authentication</div><div class="tabs"><button id="loginTab" class="active">Masuk</button><button id="signupTab">Daftar</button></div><section id="loginView"><form id="loginForm"><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Masuk ke GROVIA</button></form><div class="link"><button id="forgotBtn" type="button">Lupa password?</button></div><div class="sep">LOGIN SOSIAL</div><div class="row"><button class="btn" type="button" onclick="oauth('google')">Google</button><button class="btn" type="button" onclick="oauth('facebook')">Facebook</button></div></section><section id="signupView" class="hide"><form id="signupForm"><div class="field"><label>Nama</label><input id="signupName" type="text" autocomplete="name" minlength="2" required></div><div class="field"><label>Email</label><input id="signupEmail" type="email" autocomplete="email" required></div><div class="row"><div class="field"><label>Password</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label>Konfirmasi Password</label><input id="signupConfirm" type="password" autocomplete="new-password" minlength="8" required></div></div><button class="btn primary" type="submit">Buat Akun</button></form></section><div id="msg" class="msg"></div><div class="note">Admin memiliki akses terpisah melalui /admin/.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;const $=id=>document.getElementById(id);async function init(){const j=await fetch('/api/public-config').then(r=>r.json());if(!j.ok||!j.data?.supabaseUrl||!j.data?.supabaseAnonKey)throw Error('Konfigurasi autentikasi belum tersedia.');sb=supabase.createClient(j.data.supabaseUrl,j.data.supabaseAnonKey)}function msg(x,ok=false){$('msg').textContent=x;$('msg').className='msg'+(ok?' success':'')}function showTab(mode){const login=mode==='login';$('loginView').classList.toggle('hide',!login);$('signupView').classList.toggle('hide',login);$('loginTab').classList.toggle('active',login);$('signupTab').classList.toggle('active',!login);msg('')}async function routeAfterLogin(session){const r=await fetch('/api/auth/admin-check',{headers:{Authorization:'Bearer '+session.access_token}});const j=await r.json();if(j.ok&&j.data?.isAdmin){location.href='/admin/';return}location.href='/user/'}async function oauth(provider){try{if(!sb)await init();const{error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+'/'}});if(error)throw error}catch(e){msg(e.message||'Login sosial gagal')}}$('loginTab').onclick=()=>showTab('login');$('signupTab').onclick=()=>showTab('signup');$('forgotBtn').onclick=()=>msg('Reset password belum tersedia. Tambahkan redirect URL di Supabase Auth untuk mengaktifkannya.');$('loginForm').onsubmit=async e=>{e.preventDefault();msg('Memproses...');try{if(!sb)await init();const{data,error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)throw error;if(!data.session)throw Error('Session tidak dibuat');await routeAfterLogin(data.session)}catch(e){msg(e.message||'Login gagal')}};$('signupForm').onsubmit=async e=>{e.preventDefault();msg('Memproses pendaftaran...');try{if(!sb)await init();const name=$('signupName').value.trim(),email=$('signupEmail').value.trim(),password=$('signupPassword').value,confirm=$('signupConfirm').value;if(password!==confirm)throw Error('Konfirmasi password tidak cocok.');const{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,name}}});if(error)throw error;if(data.session){await routeAfterLogin(data.session);return}showTab('login');msg('Akun berhasil dibuat. Silakan cek email untuk konfirmasi sebelum login.',true)}catch(e){msg(e.message||'Pendaftaran gagal')}};init().catch(e=>msg(e.message));</script></body></html>
